<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Properties</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F5C4F">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#EEF2EF;
    --surface:#FFFFFF;
    --surface-2:#F8FAF9;
    --ink:#182420;
    --ink-soft:#647169;
    --border:#E1E7E3;
    --primary:#1F5C4F;
    --primary-light:#2E8C74;
    --primary-dark:#123B32;
    --primary-tint:#DCEFE8;
    --dev:#22965F;
    --dev-tint:#E0F5E9;
    --par:#D6952A;
    --par-tint:#FBF0D8;
    --negative:#E1483F;
    --negative-tint:#FCE4E2;
    --notice:#D6952A;
    --notice-tint:#FBF0D8;
    --blue:#3179C6;
    --blue-tint:#DEEAF8;
    --purple:#8A5CC7;
    --purple-tint:#EFE6F8;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:12px;
    --shadow-xs:0 1px 3px rgba(18,30,26,.07);
    --shadow-sm:0 6px 16px rgba(18,30,26,.08);
    --shadow-md:0 12px 28px rgba(18,30,26,.12);
    --shadow-hero:0 20px 44px -8px rgba(18,59,50,.45);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-smooth:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1000px 500px at 50% -8%, #E6F2EC 0%, #EEF2EF 42%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:transparent;
    position:relative;
  }
  .sidebar{ display:contents; } /* unwrapped on mobile — topbar and tabbar-wrap behave as before */

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.9); }
    to{ opacity:1; transform:scale(1); }
  }
  #content.content-fade{ animation:fadeSlideUp .32s var(--ease-smooth); }
  .stat-grid-2 .stat-card,
  .person-card,
  .list-card,
  .room-card{
    animation:fadeSlideUp .38s var(--ease-smooth) backwards;
  }
  .stat-grid-2 .stat-card:nth-child(1){ animation-delay:.02s; }
  .stat-grid-2 .stat-card:nth-child(2){ animation-delay:.06s; }
  .stat-grid-2 .stat-card:nth-child(3){ animation-delay:.10s; }
  .stat-grid-2 .stat-card:nth-child(4){ animation-delay:.14s; }

  /* Top bar */
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(238,242,239,.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top) + 16px) 18px 10px;
  }
  .topbar-title{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 12px;
    color:var(--primary-dark);
  }
  .property-filter{
    position:relative;
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    padding:4px;
    gap:2px;
    box-shadow:var(--shadow-xs);
  }
  .filter-indicator{
    position:absolute;
    top:4px; bottom:4px; left:0;
    width:0;
    background:linear-gradient(135deg, var(--primary-light), var(--primary-dark));
    border-radius:9px;
    box-shadow:0 4px 10px rgba(18,59,50,.35);
    transition:transform .32s var(--ease-spring), width .32s var(--ease-spring);
    z-index:0;
  }
  .filter-btn{
    position:relative;
    z-index:1;
    flex:1;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:700;
    padding:9px 4px;
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    transition:color .25s var(--ease-smooth);
  }
  .filter-btn.active{ color:#fff; }
  .filter-btn:active{ transform:scale(.96); }

  /* Content */
  #content{
    flex:1;
    padding:4px 18px 108px;
    overflow-y:auto;
  }
  .setup-banner{
    background:var(--negative-tint);
    border:1px solid var(--negative);
    color:var(--negative);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.5;
    margin-bottom:16px;
  }
  .setup-banner code{
    background:rgba(0,0,0,0.06);
    padding:1px 5px;
    border-radius:4px;
    font-size:12.5px;
  }
  .state-msg{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:60px 20px;
  }
  .spinner{
    width:28px;height:28px;margin:0 auto 14px;border-radius:50%;
    border:3px solid var(--primary-tint); border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Hero P&L card */
  .hero{
    background:linear-gradient(150deg, var(--primary-light) 0%, var(--primary) 45%, var(--primary-dark) 100%);
    color:#fff;
    border-radius:var(--radius-lg);
    padding:24px 22px;
    margin:10px 0 14px;
    box-shadow:var(--shadow-hero);
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; top:-60px; right:-50px;
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  }
  .hero-label{ position:relative; font-size:13px; color:#CFE9DD; margin:0 0 6px; font-weight:600; }
  .hero-value{ position:relative; font-size:36px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin:0; }
  .hero-value.neg{ color:#FFDAD5; }
  .hero-sub{ position:relative; font-size:12.5px; color:#CFE9DD; margin-top:5px; }

  .stat-grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    box-shadow:var(--shadow-xs);
    transition:transform .18s var(--ease-smooth), box-shadow .18s var(--ease-smooth);
  }
  .stat-card:active{ transform:translateY(1px) scale(.985); box-shadow:none; }
  .stat-icon{
    width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:9px;
  }
  .stat-icon svg{ width:16px; height:16px; }
  .stat-icon.blue{ background:var(--blue-tint); color:var(--blue); }
  .stat-icon.green{ background:var(--dev-tint); color:var(--dev); }
  .stat-icon.red{ background:var(--negative-tint); color:var(--negative); }
  .stat-icon.purple{ background:var(--purple-tint); color:var(--purple); }
  .stat-icon.amber{ background:var(--par-tint); color:var(--par); }
  .stat-icon.primary{ background:var(--primary-tint); color:var(--primary); }
  .stat-card .label{ font-size:12px; color:var(--ink-soft); margin:0 0 3px; font-weight:600; }
  .stat-card .value{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; margin:0; letter-spacing:-0.01em; }
  .stat-card .value.warn{ color:var(--negative); }
  .stat-card .value.info{ color:var(--purple); }
  .stat-card .value.amber{ color:var(--par); }

  .section-title{
    font-size:15px;
    font-weight:800;
    margin:22px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    color:var(--primary-dark);
  }
  .section-title .count{ font-size:12px; font-weight:600; color:var(--ink-soft); }

  .person-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:15px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-xs);
  }
  .person-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .person-name{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:9px; }
  .avatar{
    width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:12.5px; flex-shrink:0; box-shadow:var(--shadow-xs); letter-spacing:-0.02em;
  }
  .avatar.sm{ width:24px; height:24px; font-size:10.5px; border-radius:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 3px currentColor; opacity:.9; }
  .dot.dev{ background:var(--dev); color:var(--dev-tint); }
  .dot.par{ background:var(--par); color:var(--par-tint); }
  .person-total{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .mode-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); padding:5px 0; }
  .mode-row span:last-child{ color:var(--ink); font-variant-numeric:tabular-nums; font-weight:700; }

  .activity-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .activity-row:last-child{ border-bottom:none; }
  .activity-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .activity-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .activity-title{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .activity-meta{ color:var(--ink-soft); font-size:12px; }
  .activity-amt{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .activity-amt.plus{ color:var(--dev); }
  .activity-amt.minus{ color:var(--negative); }
  .activity-amt.warn{ color:var(--notice); }
  .delta-up{ color:var(--negative); }
  .delta-down{ color:var(--dev); }
  .delta-flat{ color:var(--ink-soft); }

  .room-group-title{
    font-size:12.5px;
    font-weight:800;
    color:var(--ink-soft);
    margin:18px 0 8px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  /* Cards */
  .list-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:15px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-xs);
  }
  .list-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .list-card-id{ display:flex; align-items:center; gap:11px; min-width:0; }
  .list-card-title{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .list-card-sub{ font-size:12.5px; color:var(--ink-soft); }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip{ font-size:11px; font-weight:700; padding:3.5px 9px; border-radius:20px; white-space:nowrap; }
  .chip.prop{ background:var(--primary-tint); color:var(--primary); }
  .chip.dev{ background:var(--dev-tint); color:var(--dev); }
  .chip.par{ background:var(--par-tint); color:var(--par); }
  .chip.active{ background:var(--dev-tint); color:var(--dev); }
  .chip.notice{ background:var(--notice-tint); color:var(--notice); }
  .chip.vacated{ background:#EEE; color:#888; }
  .list-card-amt{ font-size:17px; font-weight:800; margin-top:9px; font-variant-numeric:tabular-nums; }
  .list-card-due{ font-size:12.5px; margin-top:3px; color:var(--ink-soft); font-weight:600; }
  .list-card-due.overdue{ color:var(--negative); font-weight:700; }
  .list-card-actions{ display:flex; gap:8px; margin-top:11px; }
  .mini-btn{
    flex:1; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:700; padding:9px; border-radius:10px; cursor:pointer; font-family:inherit;
    transition:transform .12s var(--ease-smooth), box-shadow .12s var(--ease-smooth), opacity .12s;
  }
  .mini-btn:active{ transform:scale(.96); }
  .mini-btn.primary{
    background:linear-gradient(135deg, var(--primary-light), var(--primary));
    border-color:transparent; color:#fff; box-shadow:0 6px 14px rgba(31,92,79,.3);
  }
  .mini-btn.icon{ flex:0 0 auto; width:42px; padding:9px 0; font-size:16px; }
  .mini-btn:disabled{ opacity:.45; }

  .empty-state{
    text-align:center; color:var(--ink-soft); font-size:13.5px; padding:36px 20px;
    border:1.5px dashed var(--border); border-radius:var(--radius-md); background:rgba(255,255,255,.4);
  }

  /* Room cards */
  .room-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:15px 16px; margin-bottom:10px; box-shadow:var(--shadow-xs);
  }
  .room-card-top{ display:flex; justify-content:space-between; align-items:center; }
  .room-name{ font-size:15px; font-weight:700; }
  .room-occ{
    font-size:11.5px; color:var(--primary); font-weight:800; background:var(--primary-tint);
    padding:4px 10px; border-radius:20px;
  }
  .room-tenant-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .tenant-pill{
    font-size:12px; font-weight:700; padding:5px 11px; border-radius:20px;
    background:var(--bg); border:1px solid var(--border); color:var(--ink);
  }
  .tenant-pill.notice{ background:var(--notice-tint); color:var(--notice); border-color:transparent; }
  .tenant-pill.vacated{ background:#F1F1F1; color:#999; border-color:transparent; }
  .tenant-pill.hotel{ background:var(--purple-tint); color:var(--purple); border-color:transparent; }

  /* Floating add button */
  .fab{
    position:fixed; right:calc((100vw - 480px) / 2 + 18px); bottom:98px;
    width:56px; height:56px; border-radius:18px;
    background:linear-gradient(150deg, var(--primary-light), var(--primary-dark));
    color:#fff; border:none;
    font-size:28px; line-height:1;
    box-shadow:0 12px 24px -4px rgba(18,59,50,.5), inset 0 1px 0 rgba(255,255,255,.25);
    cursor:pointer; z-index:15;
    transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-smooth);
    animation:popIn .3s var(--ease-spring);
  }
  .fab:active{ transform:scale(.9) rotate(-6deg); box-shadow:0 6px 14px -2px rgba(18,59,50,.5); }
  @media (max-width:516px){ .fab{ right:18px; } }

  /* Bottom tab bar */
  .tabbar-wrap{
    position:sticky; bottom:0; z-index:10; padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
  }
  .tabbar{
    position:relative;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:20px;
    display:flex;
    padding:6px;
    box-shadow:var(--shadow-md);
  }
  .tab-indicator{
    position:absolute; top:6px; bottom:6px; left:0; width:0;
    background:var(--primary-tint); border-radius:14px;
    transition:transform .34s var(--ease-spring), width .34s var(--ease-spring);
    z-index:0;
  }
  .tab-btn{
    position:relative; z-index:1;
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 0; color:var(--ink-soft); font-size:10.5px; font-weight:700; font-family:inherit; cursor:pointer;
    transition:color .25s var(--ease-smooth), transform .15s var(--ease-smooth);
  }
  .tab-btn:active{ transform:scale(.92); }
  .tab-btn svg{ width:19px; height:19px; transition:transform .25s var(--ease-spring); }
  .tab-btn.active{ color:var(--primary); }
  .tab-btn.active svg{ transform:translateY(-1px) scale(1.08); }

  /* Trend charts */
  .chart-row{
    display:flex; align-items:flex-end; gap:3px; height:120px; overflow-x:auto; padding-top:4px;
  }
  .chart-col{ flex:1; min-width:26px; display:flex; flex-direction:column; align-items:center; }
  .chart-bars{ display:flex; gap:2px; align-items:flex-end; justify-content:center; height:92px; width:100%; }
  .chart-bars.single{ justify-content:center; }
  .bar{ width:7px; border-radius:3px 3px 0 0; min-height:2px; transition:height .5s var(--ease-spring); }
  .bar.rev{ background:linear-gradient(180deg, var(--dev), #1B7A4C); }
  .bar.exp{ background:linear-gradient(180deg, var(--negative), #C43A31); }
  .bar.occ{ background:linear-gradient(180deg, var(--primary-light), var(--primary-dark)); width:13px; }
  .chart-label{ font-size:9px; color:var(--ink-soft); margin-top:6px; white-space:nowrap; font-weight:600; }
  .chart-legend{ display:flex; gap:16px; justify-content:center; margin-top:12px; font-size:11.5px; color:var(--ink-soft); }
  .chart-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .legend-dot.rev{ background:var(--dev); }
  .legend-dot.exp{ background:var(--negative); }
  .cat-bar-row{ display:grid; grid-template-columns:108px 1fr 64px; align-items:center; gap:10px; padding:8px 0; }
  .cat-bar-label{
    display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .cat-dot{ width:8px; height:8px; border-radius:3px; flex-shrink:0; }
  .cat-bar-track{ height:9px; border-radius:5px; background:var(--bg); overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:5px; transition:width .6s var(--ease-spring); }
  .cat-bar-value{ font-size:12.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  .sparkline-row{ display:flex; align-items:flex-end; gap:5px; height:44px; margin-top:14px; }
  .sparkline-bar{ flex:1; border-radius:3px 3px 0 0; background:rgba(255,255,255,.55); min-height:3px; transition:height .5s var(--ease-spring); }
  .sparkline-labels{ display:flex; gap:5px; margin-top:5px; }
  .sparkline-labels span{ flex:1; text-align:center; font-size:9px; color:#CFE9DD; font-weight:600; }

  /* Modal */
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes sheetUp{ from{ opacity:0; transform:translateY(40px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(12,18,15,.5);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; z-index:30;
    animation:overlayIn .22s var(--ease-smooth);
  }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 20px); max-height:88vh; overflow-y:auto;
    box-shadow:0 -20px 50px rgba(12,18,15,.25);
    animation:sheetUp .32s var(--ease-spring);
  }
  .modal-handle{ width:38px; height:4px; border-radius:3px; background:var(--border); margin:2px auto 16px; }
  .modal-title{ font-size:17px; font-weight:800; margin:0 0 4px; color:var(--primary-dark); }
  .modal-subtitle{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:11px; padding:11px 12px;
    font-size:15px; font-family:inherit; background:var(--surface-2); color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--primary-light); box-shadow:0 0 0 3px var(--primary-tint);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px; font-size:14.5px; font-weight:800; font-family:inherit;
    cursor:pointer; transition:transform .12s var(--ease-smooth), box-shadow .12s var(--ease-smooth);
  }
  .btn:active{ transform:scale(.97); }
  .btn.cancel{ background:var(--bg); color:var(--ink-soft); }
  .btn.submit{ background:linear-gradient(135deg, var(--primary-light), var(--primary-dark)); color:#fff; box-shadow:0 8px 18px rgba(18,59,50,.32); }
  .btn.danger{ background:linear-gradient(135deg, #E9645B, var(--negative)); color:#fff; box-shadow:0 8px 18px rgba(225,72,63,.3); }
  .btn.wa-btn{
    background:linear-gradient(135deg, #2FE07A, #1DBE5C); color:#fff; display:flex; align-items:center; justify-content:center;

      <nav class="tabbar" id="tabbar"></nav>
    </div>

  <button class="fab" id="fabBtn" style="display:none;">+</button>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ============================================================ ERROR BAR */
function showErr(msg) {
  const b = document.getElementById("errBar");
  if (!b || !msg) return;
  b.textContent = "Something went wrong: " + msg + " (tap to dismiss)";
  b.style.display = "block";
  b.onclick = () => { b.style.display = "none"; };
}
window.addEventListener("error", e => { if (e.message && e.message.indexOf("ResizeObserver") === -1) showErr(e.message); });
window.addEventListener("unhandledrejection", e => showErr(String((e.reason && e.reason.message) || e.reason)));

/* ============================================================ CONFIG */
const CONFIG = {
  APPS_SCRIPT_URL: "1T9ZCGqgH2X9M0rEtMnMdamtZsyBRIDt-FaQhAOAmfpA",
  APP_TOKEN: "Y296eV9BM0Y5QjJENzhDMTRFNkE5RjM1QjhEMjQ3QzYx", // must exactly match APP_TOKEN in Code.gs — the backend rejects any request without it
  APP_PIN: "289091", // e.g. "1234" — set this to require a PIN before the app opens on this device. Leave blank to disable.
  PROPERTIES: ["Cozy 2", "Cozy 3"],
  PEOPLE: { // starting partners. Once you add or remove a partner in the Partners tab, that list is used instead.
    Dev: { modes: ["UPI Babli", "UPI Nar", "Cash Dev"], color: "dev" },
    Parvendra: { modes: ["UPI Par", "Cash Par"], color: "par" }
  },
  EXPENSE_CATEGORIES: [
    "Ration", "Vegetables", "Gas", "Dal Masala", "Electricity", "Water",
    "Staff Salary", "Maintenance & Repair", "Wifi/Internet", "Cleaning Supplies",
    "Rent", "Security deposit return", "Other"
  ],
  PARTNER_SHARE: { Dev: 50, Parvendra: 50 }, // fallback split until you set one in the Partners tab (the app then uses what you saved there)
  FOOD_CATEGORIES: ["Ration", "Vegetables", "Gas", "Dal Masala"], // these are pooled and split between properties by headcount
  KITCHEN_PROPERTY: "Cozy 2", // where the kitchen is. Food expenses are booked here by default.
  DEFAULT_COUNTRY_CODE: "91" // used to complete a 10-digit phone number for WhatsApp links
};

/* ============================================================ STATE */
let state = {
  loaded: false,
  error: null,
  property: "All",
  tab: "home",
  month: (function () { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); })(),
  report: null,
  fromCache: false,
  errMsg: "",
  data: { rooms: [], tenants: [], dues: [], payments: [], expense: [], bookings: [], settlements: [], partners: [], shares: [] }
};

/* ============================================================ HELPERS */
const rupee = n => { const v = Number(n) || 0; return (v < 0 ? "-" : "") + "₹" + Math.abs(v).toLocaleString("en-IN", { maximumFractionDigits: 0 }); };
const rupeeS = n => {
  const v = Number(n) || 0, a = Math.abs(v);
  if (a >= 100000) return (v < 0 ? "-" : "") + "₹" + (a / 100000).toFixed(2).replace(/\.?0+$/, "") + "L";
  return rupee(v);
};
const fmtDate = d => {
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
};
const periodLabel = p => {
  if (!p) return "";
  const dt = new Date(p + "-01");
  if (isNaN(dt)) return p;
  return dt.toLocaleDateString("en-IN", { month: "short", year: "numeric" });
};
const todayISO = () => new Date().toISOString().slice(0, 10);
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysOverdue(dueDateStr) {
  const d = new Date(dueDateStr); d.setHours(0, 0, 0, 0);
  return Math.round((startOfToday() - d) / 86400000);
}
function dueBalance(due) {
  return Number(due.AmountDue || 0) - Number(due.AmountPaid || 0) - Number(due.Discount || 0);
}
function bookingBalance(b) {
  return Number(b.TotalAmount || 0) - Number(b.AmountPaid || 0);
}
function nightsBetween(checkIn, checkOut) {
  const a = new Date(checkIn), b = new Date(checkOut);
  return Math.max(1, Math.round((b - a) / 86400000));
}
function activeBookingForRoom(roomId) {
  return state.data.bookings.find(b => b.RoomID === roomId && b.Status === "Active");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}
function filtered(list) {
  if (state.property === "All") return list;
  return list.filter(r => r.Property === state.property);
}
function statusChipClass(status) {
  if (status === "Notice") return "notice";
  if (status === "Vacated") return "vacated";
  return "active";
}
function uid() { return Math.random().toString(36).slice(2); }
const AVATAR_COLORS = ["#22965F", "#D6952A", "#3179C6", "#8A5CC7", "#E1483F", "#1F5C4F", "#0E8A82"];
function avatarColor(name) {
  let hash = 0;
  const str = String(name || "?");
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function initials(name) {
  return String(name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
}
function avatarChip(name, size) {
  const cls = size === "sm" ? "avatar sm" : "avatar";
  return `<span class="${cls}" style="background:${avatarColor(name)}">${initials(name)}</span>`;
}
function personForMode(mode) {
  for (const [name, cfg] of Object.entries(getPeople())) {
    if (cfg.modes.includes(mode)) return name;
  }
  return "";
}
function waLink(phone, message) {
  const digits = String(phone || "").replace(/\D/g, "");
  if (!digits) return null;
  const withCode = digits.length <= 10 ? CONFIG.DEFAULT_COUNTRY_CODE + digits : digits;
  return "https://wa.me/" + withCode + "?text=" + encodeURIComponent(message);
}
function buildReceiptMessage(tenant, info) {
  const lines = [
    "*Cozy Properties – Rent Receipt*",
    "",
    `Tenant: ${tenant.Name}`,
    `Property: ${tenant.Property}, Room ${tenant.RoomNumber || "—"}`,
    `Period: ${info.period || "—"}`,
    `Amount received: ${rupee(info.amount)}`,
    `Payment mode: ${info.mode}`
  ];
  if (info.discount > 0) lines.push(`Discount / write-off: ${rupee(info.discount)}`);
  lines.push(`Date: ${fmtDate(info.date)}`);
  lines.push(`Balance remaining: ${rupee(info.balance)}`);
  lines.push("");
  if (info.person) lines.push(`Received by: ${info.person}`);
  lines.push("Thank you!");
  return lines.join("\n");
}
function openReceiptModal(tenant, info) {
  const message = buildReceiptMessage(tenant, info);
  const link = waLink(tenant.Phone, message);
  const previewHtml = message
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/\*(.*?)\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>");
  openModal(`
    <p class="modal-title">Send receipt</p>
    <p class="modal-subtitle">${tenant.Phone ? "To " + tenant.Name + " · " + tenant.Phone : "No phone number on file for " + tenant.Name}</p>
    <div class="receipt-preview">${previewHtml}</div>
    <div class="modal-actions">
      <button class="btn cancel" onclick="closeModal()">Close</button>
      ${link
        ? `<a class="btn submit wa-btn" href="${link}" target="_blank" rel="noopener">Send on WhatsApp</a>`
        : `<button class="btn submit" disabled style="opacity:.5;">Add phone number first</button>`}
    </div>
  `);
}

/* ============================================================ API */
const CACHE_KEY = "cozy_cache_v2";
function applyData(d) {
  ["rooms", "tenants", "dues", "payments", "expense", "bookings", "settlements", "partners", "shares"].forEach(k => { state.data[k] = d[k] || []; });
}
async function loadData() {
  if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    state.error = "setup";
    state.loaded = true;
    render();
    return;
  }
  // Show the last saved data instantly, then refresh in the background
  if (!state.loaded) {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (c && c.data) { applyData(c.data); state.loaded = true; state.fromCache = true; render(); }
    } catch (err) {}
  }
  try {
    const url = CONFIG.APPS_SCRIPT_URL + "?action=getData&token=" + encodeURIComponent(CONFIG.APP_TOKEN || "");
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) {
      if (json.error === "Unauthorized") { state.error = "unauthorized"; state.loaded = true; render(); return; }
      throw new Error(json.error || "Unknown error");
    }
    applyData(json.data);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: json.data })); } catch (err) {}
    state.error = null;
    state.fromCache = false;
  } catch (err) {
    console.error(err);
    if (state.fromCache) { toast("Offline. Showing your last saved data."); }
    else { state.error = "network"; state.errMsg = String((err && err.message) || err); }
  }
  state.loaded = true;
  render();
}

async function apiPost(action, payload) {
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight with Apps Script
    body: JSON.stringify({ action, payload, token: CONFIG.APP_TOKEN || "" })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Request failed");
  return json.result;
}

/* ============================================================ SHELL */
function renderPropertyFilter() {
  const el = document.getElementById("propertyFilter");
  const opts = ["All", ...CONFIG.PROPERTIES];
  el.innerHTML = `<div class="filter-indicator" id="filterIndicator"></div>` + opts.map(p =>
    `<button class="filter-btn ${state.property === p ? "active" : ""}" data-prop="${p}">${p}</button>`
  ).join("");
  el.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.property = btn.dataset.prop; render(); });
  });
  positionIndicator(el, ".filter-btn", "filterIndicator");
}

function positionIndicator(container, btnSelector, indicatorId) {
  requestAnimationFrame(() => {
    const active = container.querySelector(btnSelector + ".active");
    const indicator = document.getElementById(indicatorId);
    if (!active || !indicator) return;
    const vertical = getComputedStyle(container).flexDirection === "column";
    if (vertical) {
      indicator.style.width = "";
      indicator.style.height = active.offsetHeight + "px";
      indicator.style.transform = `translateY(${active.offsetTop}px)`;
    } else {
      indicator.style.height = "";
      indicator.style.width = active.offsetWidth + "px";
      indicator.style.transform = `translateX(${active.offsetLeft}px)`;
    }
  });
}

/* ============================================================ REPORTS */
function monthsBack(n) {
  const arr = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) arr.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  return arr;
}
function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function monthKeyOfDate(d) { const dt = new Date(d); return isNaN(dt) ? "" : monthKey(dt); }
function keyToDate(key) { const p = key.split("-").map(Number); return new Date(p[0], p[1] - 1, 1); }
function shiftMonth(key, delta) { const d = keyToDate(key); d.setMonth(d.getMonth() + delta); return monthKey(d); }
function monthLabelLong(key) { return keyToDate(key).toLocaleDateString("en-IN", { month: "long", year: "numeric" }); }
function monthLabelShort(key) { return keyToDate(key).toLocaleDateString("en-IN", { month: "short", year: "2-digit" }); }
function dOnly(v) { if (!v) return null; const d = new Date(v); if (isNaN(d)) return null; d.setHours(0, 0, 0, 0); return d; }
function isFood(cat) { return CONFIG.FOOD_CATEGORIES.indexOf(cat) !== -1; }
function sumOf(list, field) { return list.reduce((s, x) => s + Number(x[field] || 0), 0); }

// Average tenants present per day in the month, per property (used to split the shared kitchen cost)
function headcounts(key) {
  const start = keyToDate(key);
  const y = start.getFullYear(), m = start.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const personDays = {};
  CONFIG.PROPERTIES.forEach(p => { personDays[p] = 0; });
  state.data.tenants.forEach(t => {
    if (personDays[t.Property] === undefined) return;
    const ci = dOnly(t.CheckInDate);
    if (!ci) return;
    let out = dOnly(t.MoveOutDate);
    if (!out && t.Status === "Vacated") out = dOnly(t.DepositReturnDate);
    if (!out && t.Status === "Vacated") return;
    for (let d = 1; d <= days; d++) {
      const day = new Date(y, m, d);
      if (ci <= day && (!out || out >= day)) personDays[t.Property]++;
    }
  });
  const avg = {};
  let total = 0;
  CONFIG.PROPERTIES.forEach(p => { avg[p] = personDays[p] / days; total += personDays[p]; });
  return { days, personDays, avg, totalPersonDays: total };
}

// One place that computes every number for a month. prop = "All" or a property name.
function monthReport(key, prop) {
  const all = !prop || prop === "All";
  const inMonth = d => monthKeyOfDate(d) === key;
  const payAll = state.data.payments.filter(p => inMonth(p.Date));
  const bkAll = state.data.bookings.filter(b => inMonth(b.CheckInDate));
  const exAll = state.data.expense.filter(e => inMonth(e.Date));
  const pay = payAll.filter(p => all || p.Property === prop);
  const bk = bkAll.filter(b => all || b.Property === prop);

  const rentIncome = sumOf(pay, "Amount");
  const hotelIncome = sumOf(bk, "AmountPaid");
  const income = rentIncome + hotelIncome;

  const hc = headcounts(key);
  const hcSum = CONFIG.PROPERTIES.reduce((s, p) => s + hc.avg[p], 0);
  const foodTotal = sumOf(exAll.filter(e => isFood(e.Category)), "Amount");
  const foodAlloc = {}, foodBooked = {}, nonFood = {}, incomeBy = {};
  CONFIG.PROPERTIES.forEach(p => {
    foodAlloc[p] = hcSum > 0 ? foodTotal * hc.avg[p] / hcSum : (p === CONFIG.KITCHEN_PROPERTY ? foodTotal : 0);
    foodBooked[p] = sumOf(exAll.filter(e => isFood(e.Category) && e.Property === p), "Amount");
    nonFood[p] = sumOf(exAll.filter(e => !isFood(e.Category) && e.Property === p), "Amount");
    incomeBy[p] = sumOf(payAll.filter(x => x.Property === p), "Amount") + sumOf(bkAll.filter(x => x.Property === p), "AmountPaid");
  });

  const cats = {};
  const addCat = (c, v) => { cats[c] = (cats[c] || 0) + Number(v || 0); };
  if (all) exAll.forEach(e => addCat(e.Category || "Other", e.Amount));
  else {
    exAll.filter(e => !isFood(e.Category) && e.Property === prop).forEach(e => addCat(e.Category || "Other", e.Amount));
    if (foodAlloc[prop] > 0) addCat("Food (your share)", foodAlloc[prop]);
  }
  const expense = Object.values(cats).reduce((s, v) => s + v, 0);

  const rooms = state.data.rooms.filter(r => all || r.Property === prop);
  const beds = sumOf(rooms, "Beds");
  const heads = all ? hcSum : hc.avg[prop] || 0;
  const occ = beds ? Math.min(100, (heads / beds) * 100) : 0;

  const duesM = state.data.dues.filter(d => d.Period === key && (all || d.Property === prop));
  const billed = sumOf(duesM, "AmountDue");
  const collected = sumOf(duesM, "AmountPaid");
  const collection = billed > 0 ? (collected / billed) * 100 : null;

  const collectedBy = {}, paidBy = {};
  Object.keys(getPeople()).forEach(n => { collectedBy[n] = 0; paidBy[n] = 0; });
  payAll.forEach(p => { const w = personForMode(p.PaymentMode); if (w) collectedBy[w] += Number(p.Amount || 0); });
  bkAll.forEach(b => { const w = personForMode(b.PaymentMode); if (w) collectedBy[w] += Number(b.AmountPaid || 0); });
  exAll.forEach(e => { if (paidBy[e.PaidBy] !== undefined) paidBy[e.PaidBy] += Number(e.Amount || 0); });

  return {
    key, income, rentIncome, hotelIncome, expense, profit: income - expense,
    margin: income > 0 ? ((income - expense) / income) * 100 : 0,
    cats, foodTotal, foodAlloc, foodBooked, nonFood, incomeBy, hc,
    foodPerHeadDay: hc.totalPersonDays ? foodTotal / hc.totalPersonDays : 0,
    beds, occ, billed, collected, collection, collectedBy, paidBy
  };
}

function monthNavHtml() {
  const cur = monthKey(new Date());

  </div>`;
}
function bindMonthNav() {

/* ============================================================ TRENDS */
function kpiCard(label, value, diff, fmt, goodWhenUp) {
  let d = `<p class="kpi-delta flat">no change</p>`;
  if (diff !== null && Math.abs(diff) >= 0.5) {
    const up = diff > 0;
    d = `<p class="kpi-delta ${up === goodWhenUp ? "good" : "bad"}">${up ? "▲" : "▼"} ${fmt(Math.abs(diff))}</p>`;
  }
  return `<div class="stat-card"><p class="label">${label}</p><p class="value">${value}</p>${d}</div>`;
}

function renderTrends() {
  const prop = state.property;
  const cur = monthReport(state.month, prop);
  const prev = monthReport(shiftMonth(state.month, -1), prop);
  const pts = n => Math.round(n) + " pts";

  const collDiff = cur.collection !== null && prev.collection !== null ? cur.collection - prev.collection : null;
  const kpis = `
    <div class="stat-grid-2">
      ${kpiCard("Collection rate", cur.collection === null ? "—" : Math.round(cur.collection) + "%", collDiff, pts, true)}
      ${kpiCard("Occupancy", Math.round(cur.occ) + "%", cur.occ - prev.occ, pts, true)}
      ${kpiCard("Profit margin", Math.round(cur.margin) + "%", cur.margin - prev.margin, pts, true)}
      ${kpiCard("Food per head / day", rupee(cur.foodPerHeadDay), cur.foodPerHeadDay - prev.foodPerHeadDay, rupee, false)}
    </div>`;

  // What moved profit: income changes count as-is, cost changes count against profit
  const drivers = [["Rent collected", cur.rentIncome - prev.rentIncome], ["Hotel income", cur.hotelIncome - prev.hotelIncome]];
  new Set([...Object.keys(cur.cats), ...Object.keys(prev.cats)]).forEach(c => drivers.push([c, -((cur.cats[c] || 0) - (prev.cats[c] || 0))]));
  const top = drivers.filter(d => Math.round(d[1]) !== 0).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 6);
  const maxD = Math.max(1, ...top.map(d => Math.abs(d[1])));
  const pDelta = cur.profit - prev.profit;
  const why = `
    <p class="section-title">Why profit ${pDelta >= 0 ? "rose" : "fell"} ${rupee(Math.abs(pDelta))}<span class="count">vs ${monthLabelShort(shiftMonth(state.month, -1))}</span></p>
    <div class="list-card">
      ${top.length ? top.map(d => `
        <div class="why-row">
          <span class="why-label">${d[0]}</span>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(Math.abs(d[1]) / maxD * 100)}%;background:${d[1] >= 0 ? "var(--dev)" : "var(--negative)"}"></div></div>
          <span class="why-amt ${d[1] >= 0 ? "delta-down" : "delta-up"}">${d[1] >= 0 ? "+" : "-"}${rupee(Math.abs(d[1]))}</span>
        </div>`).join("") : `<p class="empty-state">No change from last month yet.</p>`}
    </div>`;

  // Unpaid rent by age
  const dues = filtered(state.data.dues).map(d => ({ d, bal: dueBalance(d), age: daysOverdue(d.DueDate) })).filter(x => x.bal > 0.5 && x.age >= 0);
  const buckets = [["0–30 days", 0, 30, "#eda100"], ["31–60 days", 31, 60, "#eb6834"], ["60+ days", 61, 99999, "#e34948"]].map(b => {
    const items = dues.filter(x => x.age >= b[1] && x.age <= b[2]);
    return { label: b[0], color: b[3], amt: items.reduce((s, x) => s + x.bal, 0), n: new Set(items.map(x => x.d.TenantID)).size };
  });
  const totalDue = buckets.reduce((s, b) => s + b.amt, 0);
  const aging = `
    <p class="section-title">Unpaid rent by age<span class="count">${rupee(totalDue)}</span></p>
    <div class="list-card">
      ${totalDue > 0 ? `
        <div class="age-bar">${buckets.filter(b => b.amt > 0).map(b => `<i style="width:${(b.amt / totalDue) * 100}%;background:${b.color}"></i>`).join("")}</div>
        ${buckets.map(b => `<div class="kv"><span><i class="legend-dot" style="background:${b.color}"></i> ${b.label}</span><span>${rupee(b.amt)} · ${b.n} tenant${b.n === 1 ? "" : "s"}</span></div>`).join("")}`
        : `<p class="empty-state">No unpaid rent. Nice.</p>`}
    </div>`;

  // Properties side by side (food already split by headcount)
  const propRows = CONFIG.PROPERTIES.map(p => ({ p, r: monthReport(state.month, p) }));
  const props = `
    <p class="section-title">Property comparison<span class="count">${monthLabelShort(state.month)}</span></p>
    <div class="list-card">
      <table class="tbl"><tr><th></th><th>Income</th><th>Cost</th><th>Profit</th><th>Occ.</th></tr>
        ${propRows.map(x => `<tr><td>${x.p}</td><td>${rupeeS(x.r.income)}</td><td>${rupeeS(x.r.expense)}</td><td class="${x.r.profit < 0 ? "delta-up" : ""}">${rupeeS(x.r.profit)}</td><td>${Math.round(x.r.occ)}%</td></tr>`).join("")}
      </table>
      <p class="field-hint">Cost includes each property's share of the kitchen, split by headcount.</p>
    </div>`;

  // Last 6 months
  const six = monthsBack(6).map(d => monthReport(monthKey(d), prop));
  const sixTbl = `
    <p class="section-title">Last 6 months${prop !== "All" ? " · " + prop : ""}</p>
    <div class="list-card">
      <table class="tbl"><tr><th></th><th>Income</th><th>Cost</th><th>Profit</th><th>Occ.</th></tr>
        ${six.slice().reverse().map(r => `<tr><td>${monthLabelShort(r.key)}</td><td>${rupeeS(r.income)}</td><td>${rupeeS(r.expense)}</td><td class="${r.profit < 0 ? "delta-up" : ""}">${rupeeS(r.profit)}</td><td>${Math.round(r.occ)}%</td></tr>`).join("")}
      </table>
    </div>`;

  // Plain-language things to act on
  const tips = [];
  const upCats = Object.keys(cur.cats).map(c => ({ c, now: cur.cats[c], was: prev.cats[c] || 0 })).filter(x => x.now - x.was > 0).sort((a, b) => (b.now - b.was) - (a.now - a.was));
  if (upCats[0] && upCats[0].now - upCats[0].was >= 500) {
    const u = upCats[0];
    tips.push(["warn", u.was > 0 ? `${u.c} is up ${Math.round((u.now - u.was) / u.was * 100)}% (${rupee(u.was)} to ${rupee(u.now)}), the biggest cost increase.` : `${u.c} is new this month at ${rupee(u.now)}.`]);
  }
  const late = new Set(dues.filter(x => x.age > 60).map(x => x.d.TenantID));
  if (late.size) tips.push(["bad", `${late.size} tenant${late.size === 1 ? " is" : "s are"} over 60 days late (${rupee(buckets[2].amt)}). Chase these first.`]);
  if (cur.collection !== null && cur.collection < 90 && cur.billed - cur.collected > 0) tips.push(["warn", `Only ${Math.round(cur.collection)}% of this month's rent is collected. ${rupee(cur.billed - cur.collected)} is still pending.`]);
  const live = filtered(state.data.tenants).filter(t => t.Status === "Active" || t.Status === "Notice");
  const bedsNow = sumOf(filtered(state.data.rooms), "Beds");
  const hotelNow = filtered(state.data.bookings).filter(b => b.Status === "Active").length;
  const vacant = Math.max(0, bedsNow - live.length - hotelNow);
  const avgRent = live.length ? sumOf(live, "RentAmount") / live.length : 0;
  if (vacant > 0 && avgRent > 0) tips.push(["info", `${vacant} bed${vacant === 1 ? " is" : "s are"} vacant, about ${rupee(vacant * avgRent)} a month in rent not earned.`]);
  if (prev.foodPerHeadDay > 0 && cur.foodPerHeadDay > prev.foodPerHeadDay * 1.08) tips.push(["warn", `Food cost per head is up to ${rupee(cur.foodPerHeadDay)} a day from ${rupee(prev.foodPerHeadDay)}.`]);
  const insights = `
    <p class="section-title">What needs attention</p>
    <div class="list-card">
      ${tips.length ? tips.map(t => `<div class="insight"><span class="ins-dot ${t[0]}">${t[0] === "info" ? "i" : "!"}</span><span>${t[1]}</span></div>`).join("") : `<p class="empty-state">Nothing stands out this month.</p>`}
    </div>`;

  return monthNavHtml() + kpis + insights + why + aging + props + sixTbl;
}

/* ============================================================ PARTNERS */
function getPeople(onlyActive) {
  const out = {};
  if (state.data.partners.length) {
    state.data.partners.forEach(p => {
      const active = String(p.Active || "Yes") !== "No";
      if (onlyActive && !active) return;
      out[p.Name] = { modes: String(p.Modes || "").split(",").map(x => x.trim()).filter(Boolean), active, id: p.ID };
    });
  } else {
    Object.entries(CONFIG.PEOPLE).forEach(([n, c]) => { out[n] = { modes: c.modes, active: true, id: null }; });
  }
  return out;
}
function allModes() { return [].concat(...Object.values(getPeople()).map(p => p.modes)); }
function personChipClass(name) { return Object.keys(getPeople()).indexOf(name) % 2 === 0 ? "dev" : "par"; }

// Share split for a property in a month: the setting for that month, else the latest earlier one, else the default in CONFIG
function sharesFor(key, prop) {
  const rows = state.data.shares.filter(s => s.Property === prop);
  const months = Array.from(new Set(rows.map(r => String(r.Month)))).filter(m => m <= key).sort();
  if (months.length) {
    const m = months[months.length - 1];
    return { list: rows.filter(r => String(r.Month) === m).map(r => ({ partner: r.Partner, pct: Number(r.Percent) })), source: m === key ? "set" : "carried", from: m };
  }
  return { list: Object.entries(CONFIG.PARTNER_SHARE).map(([n, v]) => ({ partner: n, pct: Number(v) })), source: "default", from: "" };
}
function splitText(list) { return list.filter(x => x.pct > 0).map(x => `${x.partner} ${+x.pct.toFixed(2)}%`).join(" · "); }

function settlementCalc(key, r) {
  const names = new Set(Object.keys(getPeople()));
  CONFIG.PROPERTIES.forEach(p => sharesFor(key, p).list.forEach(s => names.add(s.partner)));
  const ent = {}, held = {}, gap = {}, propProfit = {};
  names.forEach(n => { ent[n] = 0; });
  CONFIG.PROPERTIES.forEach(p => {
    propProfit[p] = r.incomeBy[p] - r.nonFood[p] - r.foodAlloc[p];
    sharesFor(key, p).list.forEach(s => { ent[s.partner] += propProfit[p] * s.pct / 100; });
  });
  names.forEach(n => { held[n] = (r.collectedBy[n] || 0) - (r.paidBy[n] || 0); gap[n] = held[n] - ent[n]; });
  // People holding more than their share pay people holding less
  const pay = [...names].filter(n => gap[n] > 0.5).map(n => ({ n, a: gap[n] })).sort((a, b) => b.a - a.a);
  const get = [...names].filter(n => gap[n] < -0.5).map(n => ({ n, a: -gap[n] })).sort((a, b) => b.a - a.a);
  const transfers = [];
  let i = 0, j = 0;
  while (i < pay.length && j < get.length) {
    const x = Math.min(pay[i].a, get[j].a);
    transfers.push({ from: pay[i].n, to: get[j].n, amount: Math.round(x) });
    pay[i].a -= x; get[j].a -= x;
    if (pay[i].a < 0.5) i++;
    if (get[j].a < 0.5) j++;
  }
  return { names: [...names], ent, held, gap, propProfit, transfers: transfers.filter(t => t.amount > 0) };
}
const signed = n => (Math.round(n) >= 0 ? "+" : "-") + rupeeS(Math.abs(n));

function renderPartners() {
  const key = state.month;
  const r = monthReport(key, "All");

  const done = state.data.settlements.filter(x => String(x.Month) === key);
  const kitchen = CONFIG.KITCHEN_PROPERTY;
  const others = CONFIG.PROPERTIES.filter(p => p !== kitchen);
  const people = getPeople();

  const sharing = `
    <p class="section-title">Profit sharing<span class="count">${monthLabelShort(key)}</span></p>

          : sh.source === "carried" ? `<span class="chip notice">From ${monthLabelShort(sh.from)}</span>`

        return `<div class="share-line">
          <div class="share-main"><b>${p}</b> ${tag}<div class="share-split">${splitText(sh.list) || "Not set"}</div></div>
          <button class="mini-btn" data-share-edit="${p}">Edit</button>

      <p class="field-hint">A split applies from the month you set it until you set a new one. You can set past or future months.</p>
    </div>`;

  const settle = `
    <p class="section-title">Month-end settlement</p>
    <div class="list-card">
      <div class="kv"><span>Income (rent + hotel)</span><span>${rupee(r.income)}</span></div>
      <div class="kv"><span>Expenses (food ${rupee(r.foodTotal)} + other ${rupee(r.expense - r.foodTotal)})</span><span>${rupee(r.expense)}</span></div>
      <div class="kv total"><span>Net ${r.profit >= 0 ? "profit" : "loss"}</span><span class="${r.profit < 0 ? "delta-up" : ""}">${rupee(r.profit)}</span></div>
      <div style="margin-top:8px">
        ${s.names.map(n => `<div class="pt-row">
          <div class="pt-top"><b>${n}</b><span class="${s.gap[n] > 0.5 ? "delta-up" : (s.gap[n] < -0.5 ? "delta-down" : "")}">Gap ${signed(s.gap[n])}</span></div>
          <div class="pt-sub">Share ${rupee(s.ent[n])} · Collected ${rupee(r.collectedBy[n] || 0)} · Paid out ${rupee(r.paidBy[n] || 0)}</div>
        </div>`).join("")}
      </div>
      ${s.transfers.length ? s.transfers.map(t => `<div class="result-banner">${t.from} pays ${t.to} ${rupee(t.amount)}</div>`).join("") : `<div class="result-banner">All square this month</div>`}
      <p class="field-hint">Share = each partner's part of every property's profit. Gap = cash they hold (collected minus paid out) minus their share. Whoever holds more than their share pays those who hold less.</p>
      <div id="settleAction">${done.length
        ? done.map(x => `<p class="field-hint" style="color:var(--dev);font-weight:700">Settled: ${x.FromPartner} paid ${x.ToPartner} ${rupee(x.Amount)} on ${fmtDate(x.Date)}.</p>`).join("")
        : (s.transfers.length ? `<button class="btn submit" id="settleBtn" style="width:100%;margin-top:10px">Mark as settled</button>` : "")}</div>
    </div>`;

  const hc = r.hc;
  const split = `
    <p class="section-title">Food cost split<span class="count">kitchen in ${kitchen}</span></p>
    <div class="list-card">
      <div class="kv"><span>Total food this month</span><span>${rupee(r.foodTotal)}</span></div>
      <div class="kv"><span>Per head per day</span><span>${rupee(r.foodPerHeadDay)}</span></div>
      <table class="tbl" style="margin-top:6px">
        <tr><th></th><th>Avg heads</th><th>Share</th><th>Food cost</th></tr>
        ${CONFIG.PROPERTIES.map(p => `<tr><td>${p}</td><td>${hc.avg[p].toFixed(1)}</td><td>${hc.totalPersonDays ? Math.round(hc.personDays[p] / hc.totalPersonDays * 100) : 0}%</td><td>${rupeeS(r.foodAlloc[p])}</td></tr>`).join("")}
      </table>
      ${others.map(p => `<div class="result-banner">${p} owes ${kitchen} ${rupee(r.foodAlloc[p])}</div>`).join("")}
      <p class="field-hint">Headcount is the average number of tenants staying each day this month. Hotel guests are not counted. Food categories: ${CONFIG.FOOD_CATEGORIES.join(", ")}.</p>
    </div>
    <div class="list-card">
      <table class="tbl"><tr><th></th><th>Income</th><th>Before split</th><th>After split</th></tr>
        ${CONFIG.PROPERTIES.map(p => {
          const before = r.incomeBy[p] - r.nonFood[p] - r.foodBooked[p];
          const after = r.incomeBy[p] - r.nonFood[p] - r.foodAlloc[p];
          return `<tr><td>${p}</td><td>${rupeeS(r.incomeBy[p])}</td><td>${rupeeS(before)}</td><td class="${after < 0 ? "delta-up" : ""}">${rupeeS(after)}</td></tr>`;
        }).join("")}
      </table>
      <p class="field-hint">Profit by property. If a partner buys kitchen items from ${others.join("/")}, enter it as a food expense. It is booked to ${kitchen} automatically and counted as paid by that partner above.</p>
    </div>`;

  const partnerList = `
    <p class="section-title">Partners<span class="count"><button class="link-btn" id="addPartnerBtn">+ Add partner</button></span></p>
    <div class="list-card">
      ${Object.entries(people).map(([n, p]) => `
        <div class="share-line">
          <div class="share-main">${avatarChip(n, "sm")} <b>${n}</b> ${p.active ? "" : `<span class="chip vacated">Removed</span>`}
            <div class="share-split">${p.modes.length ? p.modes.join(", ") : "No payment modes"}</div></div>
          <button class="mini-btn" data-partner-toggle="${n}">${p.active ? "Remove" : "Restore"}</button>
        </div>`).join("")}
      <p class="field-hint">Payment modes decide whose cash a payment counts as. Removing a partner keeps all past months and reports intact.</p>
    </div>`;

  const past = state.data.settlements.slice().sort((a, b) => String(b.Month).localeCompare(String(a.Month))).slice(0, 6);
  const history = `
    <p class="section-title">Past settlements</p>
    <div class="list-card">
      ${past.length ? past.map(x => `<div class="kv"><span>${monthLabelShort(String(x.Month))} · ${x.FromPartner} to ${x.ToPartner}</span><span>${rupee(x.Amount)}</span></div>`).join("") : `<p class="empty-state">Nothing recorded yet.</p>`}
    </div>`;

  return monthNavHtml() + sharing + settle + split + partnerList + history;
}

function bindPartners() {
  document.querySelectorAll("[data-share-edit]").forEach(b => b.addEventListener("click", () => openShareModal(b.dataset.shareEdit, state.month)));
  document.querySelectorAll("[data-partner-toggle]").forEach(b => b.addEventListener("click", () => confirmTogglePartner(b.dataset.partnerToggle)));
  const add = document.getElementById("addPartnerBtn");
  if (add) add.addEventListener("click", openAddPartnerModal);
  const btn = document.getElementById("settleBtn");
  if (btn) btn.addEventListener("click", async () => {
    const s = settlementCalc(state.month, state.report);
    btn.disabled = true;
    try {
      for (const t of s.transfers) {
        await apiPost("addSettlement", { Month: state.month, FromPartner: t.from, ToPartner: t.to, Amount: t.amount, Date: todayISO(), Notes: "" });
      }
      toast("Settlement saved");
      await loadData();
    } catch (err) { btn.disabled = false; toast("Couldn't save: " + err.message); }
  });
}

/* ---------- share editor ---------- */
function shareMonthOptions(selected) {
  const out = [];
  const base = monthKey(new Date());
  for (let i = -12; i <= 6; i++) { const k = shiftMonth(base, i); out.push(`<option value="${k}" ${k === selected ? "selected" : ""}>${monthLabelLong(k)}</option>`); }
  return out.join("");
}

function openShareModal(prop, key, draft) {
  let month = key;
  const existing = sharesFor(month, prop);
  let rows = draft || existing.list.map(x => ({ partner: x.partner, pct: x.pct }));
  const hasOverride = existing.source === "set";
  const active = Object.keys(getPeople(true));
  const addable = active.filter(n => !rows.some(r => r.partner === n));
  const total = rows.reduce((s, r) => s + (Number(r.pct) || 0), 0);

  openModal(`
    <p class="modal-title">Profit share · ${prop}</p>
    <p class="modal-subtitle">Applies from the month you pick until you set a new split.</p>
    <div class="field"><label>Month</label><select id="shMonth">${shareMonthOptions(month)}</select></div>
    <div id="shRows">
      ${rows.map((r, i) => `
        <div class="share-edit-row">
          <span class="share-edit-name">${r.partner}</span>
          <input type="number" min="0" max="100" step="0.5" value="${r.pct}" data-share-i="${i}"><span>%</span>
          <button type="button" class="x-btn" data-share-rm="${i}" aria-label="Remove ${r.partner} from this split">×</button>
        </div>`).join("")}
    </div>
    <div class="field" style="margin-top:8px"><label>Add partner to this split</label>
      <select id="shAdd"><option value="">Choose…</option>${addable.map(n => `<option value="${n}">${n}</option>`).join("")}</select>
    </div>
    <p class="share-total ${Math.abs(total - 100) < 0.01 ? "ok" : "bad"}" id="shTotal">Total ${+total.toFixed(2)}%${Math.abs(total - 100) < 0.01 ? "" : " (must be 100%)"}</p>
    <p class="field-error" id="shErr"></p>
    <div class="modal-actions">
      <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn submit" id="shSave">Save split</button>
    </div>
    ${hasOverride ? `<button type="button" class="link-btn" id="shClear" style="margin-top:12px">Remove the ${monthLabelShort(month)} setting (use the earlier split)</button>` : ""}
  `);

  const sync = () => { document.querySelectorAll("[data-share-i]").forEach(inp => { rows[Number(inp.dataset.shareI)].pct = inp.value === "" ? 0 : Number(inp.value); }); };
  document.querySelectorAll("[data-share-i]").forEach(inp => inp.addEventListener("input", () => {
    sync();
    const t = rows.reduce((s, r) => s + (Number(r.pct) || 0), 0);
    const el = document.getElementById("shTotal");
    el.textContent = "Total " + +t.toFixed(2) + "%" + (Math.abs(t - 100) < 0.01 ? "" : " (must be 100%)");
    el.className = "share-total " + (Math.abs(t - 100) < 0.01 ? "ok" : "bad");
  }));
  document.querySelectorAll("[data-share-rm]").forEach(b => b.addEventListener("click", () => { sync(); rows.splice(Number(b.dataset.shareRm), 1); openShareModal(prop, month, rows); }));
  document.getElementById("shAdd").addEventListener("change", e => { if (!e.target.value) return; sync(); rows.push({ partner: e.target.value, pct: 0 }); openShareModal(prop, month, rows); });
  document.getElementById("shMonth").addEventListener("change", e => { openShareModal(prop, e.target.value); });
  document.getElementById("shSave").addEventListener("click", async () => {
    sync();
    const t = rows.reduce((s, r) => s + (Number(r.pct) || 0), 0);
    const err = document.getElementById("shErr");
    const m = document.getElementById("shMonth").value;
    if (!rows.length || Math.abs(t - 100) >= 0.01) { err.textContent = "Percentages must add up to exactly 100%."; err.style.display = "block"; return; }
    try {
      await apiPost("saveShares", { month: m, property: prop, rows: rows.map(r => ({ Partner: r.partner, Percent: Number(r.pct) })) });
      closeModal(); toast("Split saved"); await loadData();
    } catch (e) { err.textContent = e.message; err.style.display = "block"; }
  });
  const clr = document.getElementById("shClear");
  if (clr) clr.addEventListener("click", async () => {
    try { await apiPost("deleteShares", { month, property: prop }); closeModal(); toast("Setting removed"); await loadData(); }
    catch (e) { toast("Couldn't remove: " + e.message); }
  });
}

/* ============================================================ MAIN RENDER */
function triggerFade(el) {
  el.classList.remove("content-fade");
  void el.offsetWidth;
  el.classList.add("content-fade");
}

function render() {
  renderPropertyFilter();
  renderTabbar();
  const content = document.getElementById("content");
  const fab = document.getElementById("fabBtn");

  if (!state.loaded) {
    content.innerHTML = `<div class="state-msg"><div class="spinner"></div>Loading your data…</div>`;
    fab.style.display = "none";
    triggerFade(content);
    return;
  }
  if (state.error === "setup") {
    content.innerHTML = `<div class="setup-banner">This app isn't connected to your Google Sheet yet. Open <code>index.html</code>, find <code>APPS_SCRIPT_URL</code> near the top of the script, and paste in your Apps Script Web App URL. See SETUP-GUIDE.md for the full steps.</div>`;
    fab.style.display = "none";
    triggerFade(content);
    return;
  }
  if (state.error === "network") {
    content.innerHTML = `<div class="setup-banner">Couldn't load your data. Check these three things, then <a href="javascript:location.reload()">reload</a>:<br>1. The Apps Script deployment's "Who has access" is <b>Anyone</b> (not "Anyone with Google account").<br>2. <code>APPS_SCRIPT_URL</code> ends in <code>/exec</code>.<br>3. You opened this page from your hosted link, not a file from Drive or WhatsApp.<br><small>Details: ${state.errMsg || "none"}</small></div>`;
    fab.style.display = "none";
    triggerFade(content);
    return;
  }
  if (state.error === "unauthorized") {
    content.innerHTML = `<div class="setup-banner">This app's token doesn't match the one in your Apps Script. Make sure <code>APP_TOKEN</code> in <code>index.html</code> is identical to <code>APP_TOKEN</code> in <code>Code.gs</code>, redeploy if you just changed it, then <a href="javascript:location.reload()">reload</a>.</div>`;
    fab.style.display = "none";
    triggerFade(content);
    return;
  }

  const showFab = (onclick) => {
    fab.style.display = "flex"; fab.style.alignItems = "center"; fab.style.justifyContent = "center";
    fab.onclick = onclick;
  };

  if (state.tab === "home") { content.innerHTML = renderHome(); fab.style.display = "none"; }
  if (state.tab === "tenants") { content.innerHTML = renderTenants(); showFab(openAddTenantModal); bindTenantActions(); }
  if (state.tab === "rooms") { content.innerHTML = renderRooms(); showFab(openAddRoomModal); bindRoomActions(); }
  if (state.tab === "expense") { content.innerHTML = renderExpense(); showFab(openAddExpenseModal); }
  if (state.tab === "trends") { content.innerHTML = renderTrends(); fab.style.display = "none"; bindMonthNav(); }
  if (state.tab === "partners") { content.innerHTML = renderPartners(); fab.style.display = "none"; bindMonthNav(); bindPartners(); }
  triggerFade(content);
}

function openBookRoomModal(room) {
  if (!room) return;
  const checkOutDefault = new Date(); checkOutDefault.setDate(checkOutDefault.getDate() + 1);
  openModal(`
    <p class="modal-title">Book as hotel — Room ${room.RoomNumber}</p>
    <p class="modal-subtitle">${room.Property} · this room is currently vacant</p>
    <form id="bookingForm">
      <div class="field"><label>Guest name</label><input name="GuestName" required></div>
      <div class="field"><label>Phone</label><input name="Phone" type="tel"></div>
      <div class="field"><label>Check-in</label><input name="CheckInDate" id="bkCheckIn" type="date" value="${todayISO()}" required></div>
      <div class="field"><label>Check-out</label><input name="CheckOutDate" id="bkCheckOut" type="date" value="${checkOutDefault.toISOString().slice(0,10)}" required></div>
      <div class="field"><label>Rate per night (₹)</label><input name="RatePerNight" id="bkRate" type="number" min="0" required></div>
      <div class="field"><label>Total amount (₹)</label><input name="TotalAmount" id="bkTotal" type="number" min="0" placeholder="Auto-calculated from nights × rate"></div>
      <div class="field"><label>Amount received now (₹)</label><input name="AmountPaid" type="number" min="0" value="0"></div>
      <div class="field"><label>Payment mode</label>
        <select name="PaymentMode">
          ${Object.entries(getPeople(true)).map(([person, cfg]) =>
            `<optgroup label="${person}">${cfg.modes.map(m => `<option value="${m}">${m}</option>`).join("")}</optgroup>`
          ).join("")}
        </select>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea name="Notes"></textarea></div>
      <p class="field-hint" id="bkNights"></p>
      <p class="field-error" id="bookingErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Check in</button>
      </div>
    </form>
  `);
  const updateNights = () => {
    const ci = document.getElementById("bkCheckIn").value;
    const co = document.getElementById("bkCheckOut").value;
    const rate = Number(document.getElementById("bkRate").value || 0);
    if (!ci || !co) return;
    const nights = nightsBetween(ci, co);
    document.getElementById("bkNights").textContent = `${nights} night${nights === 1 ? "" : "s"} × ${rupee(rate)} = ${rupee(nights * rate)} suggested total`;
    if (!document.getElementById("bkTotal").value) document.getElementById("bkTotal").placeholder = rupee(nights * rate);
  };
  ["bkCheckIn", "bkCheckOut", "bkRate"].forEach(id => document.getElementById(id).addEventListener("input", updateNights));
  updateNights();

  document.getElementById("bookingForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.Property = room.Property;
    payload.RoomID = room.ID;
    payload.RoomNumber = room.RoomNumber;
    if (!payload.TotalAmount) delete payload.TotalAmount; // let the backend compute nights × rate
    try {
      await apiPost("addBooking", payload);
      closeModal(); toast("Guest checked in"); await loadData();
    } catch (err) {
      document.getElementById("bookingErr").textContent = err.message;
      document.getElementById("bookingErr").style.display = "block";
    }
  });
}

function openTenantManageSheet(tenantId) {
  const t = state.data.tenants.find(x => x.ID === tenantId);
  if (!t) return;
  const actions = [{ label: "Edit tenant", onClick: () => openEditTenantModal(t) }];
  const lastPayment = state.data.payments.filter(p => p.TenantID === t.ID).sort((a, b) => new Date(b.Date) - new Date(a.Date))[0];
  if (lastPayment) actions.push({ label: "Resend last receipt (WhatsApp)", onClick: () => resendReceipt(t, lastPayment) });
  if (t.Status === "Active") actions.push({ label: "Start notice period", onClick: () => openStartNoticeModal(t) });
  if ((t.Status === "Notice" || t.Status === "Vacated") && t.DepositReturned !== "Yes") {
    actions.push({ label: "Return security deposit", onClick: () => openReturnDepositModal(t) });
  }
  actions.push({ label: "Remove tenant", danger: true, onClick: () => confirmDeleteTenant(t) });
  openActionSheet(`${t.Name} · ${t.Property} Room ${t.RoomNumber || "—"}`, actions);
}

function resendReceipt(tenant, payment) {
  const due = state.data.dues.find(d => d.ID === payment.DueID);
  openReceiptModal(tenant, {
    amount: Number(payment.Amount || 0),
    mode: payment.PaymentMode,
    discount: Number(payment.Discount || 0),
    date: payment.Date,
    period: due ? periodLabel(due.Period) : "",
    balance: due ? Math.max(0, dueBalance(due)) : 0,
    person: personForMode(payment.PaymentMode)
  });
}

  document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
    try {
      await apiPost("deleteTenant", { id: t.ID });
      closeModal(); toast("Tenant removed"); await loadData();
    } catch (err) { toast("Couldn't remove: " + err.message); }
  });
}

/* ============================================================ NOTICE */
function openStartNoticeModal(t) {
  const suggested = new Date(); suggested.setDate(suggested.getDate() + 30);
  openModal(`
    <p class="modal-title">Start notice — ${t.Name}</p>
    <p class="modal-subtitle">Rent for the move-out month will be recalculated automatically for the days actually stayed.</p>
    <form id="noticeForm">
      <div class="field"><label>Last date in property</label><input name="moveOutDate" type="date" value="${suggested.toISOString().slice(0,10)}" required></div>
      <p class="field-error" id="noticeErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Start notice</button>
      </div>
    </form>
  `);
  document.getElementById("noticeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.id = t.ID;
    try {
      const result = await apiPost("startNotice", payload);
      closeModal();
      toast(`Notice started — final rent ${rupee(result.proratedAmount)}`);
      await loadData();
    } catch (err) {
      document.getElementById("noticeErr").textContent = err.message;
      document.getElementById("noticeErr").style.display = "block";
    }
  });
}

/* ============================================================ DEPOSIT RETURN */

  openModal(`
    <p class="modal-title">Return deposit — ${t.Name}</p>
    <p class="modal-subtitle">This logs the payout as an expense and marks the tenant vacated.</p>
    <form id="depositForm">
      <div class="field"><label>Amount to return (₹)</label><input name="amount" type="number" min="0" value="${t.Deposit || 0}" required></div>
      <div class="field"><label>Paid from</label>
        <select name="paidBy">${Object.keys(getPeople(true)).map(p => `<option value="${p}">${p}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div>
      <p class="field-error" id="depositErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Return deposit</button>
      </div>
    </form>
  `);
  document.getElementById("depositForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.id = t.ID;
    try {
      await apiPost("returnDeposit", payload);
      closeModal(); toast("Deposit returned"); await loadData();
    } catch (err) {
      document.getElementById("depositErr").textContent = err.message;
      document.getElementById("depositErr").style.display = "block";
    }
  });
}

/* ============================================================ PAYMENTS */
function openRecordPaymentModal(tenantId) {
  const tenant = state.data.tenants.find(t => t.ID === tenantId);
  if (!tenant) return;
  const openDues = tenantOpenDues(tenantId);
  if (!openDues.length) { toast("No dues currently outstanding for this tenant."); return; }

  openModal(`
    <p class="modal-title">Record payment — ${tenant.Name}</p>
    <form id="paymentForm">
      <div class="field"><label>For period</label>
        <select name="dueId" id="dueSelect">
          ${openDues.map(d => `<option value="${d.ID}" data-balance="${dueBalance(d)}">${periodLabel(d.Period)} — ${rupee(dueBalance(d))} due</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Date</label><input name="date" type="date" value="${todayISO()}" required></div>
      <div class="field"><label>Amount received (₹)</label><input name="amount" id="amountInput" type="number" min="0" value="${dueBalance(openDues[0])}" required></div>
      <div class="field"><label>Payment mode</label>
        <select name="paymentMode">
          ${Object.entries(getPeople(true)).map(([person, cfg]) =>
            `<optgroup label="${person}">${cfg.modes.map(m => `<option value="${m}">${m}</option>`).join("")}</optgroup>`
          ).join("")}
        </select>
      </div>
      <div class="field"><label>Discount / write-off (₹, optional)</label><input name="discount" type="number" min="0" value="0"></div>
      <div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div>
      <p class="field-error" id="paymentErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Save payment</button>
      </div>
    </form>
  `);
  document.getElementById("dueSelect").addEventListener("change", e => {
    const bal = e.target.selectedOptions[0].dataset.balance;
    document.getElementById("amountInput").value = bal;
  });
  document.getElementById("paymentForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.tenantId = tenantId;
    const selectedDue = openDues.find(d => d.ID === payload.dueId) || openDues[0];
    const amount = Number(payload.amount || 0);
    const discount = Number(payload.discount || 0);
    const balance = Math.max(0, dueBalance(selectedDue) - amount - discount);
    try {
      await apiPost("recordPayment", payload);
      toast("Payment recorded");
      await loadData();
      openReceiptModal(tenant, {
        amount, discount, balance,
        mode: payload.paymentMode,
        date: payload.date,
        period: periodLabel(selectedDue.Period),
        person: personForMode(payload.paymentMode)
      });
    } catch (err) {
      document.getElementById("paymentErr").textContent = err.message;
      document.getElementById("paymentErr").style.display = "block";
    }
  });
}

/* ============================================================ EXPENSE */
function categoryOptions() {
  const used = Array.from(new Set(state.data.expense.map(e => e.Category).filter(Boolean)));
  const merged = Array.from(new Set([...CONFIG.EXPENSE_CATEGORIES, ...used]));
  merged.sort((a, b) => a.localeCompare(b));
  return merged;
}

function openAddExpenseModal() {
  openModal(`
    <p class="modal-title">Add expense</p>
    <form id="expenseForm">
      <div class="field"><label>Property</label>
        <select name="Property" id="expProp">${CONFIG.PROPERTIES.map(p => `<option value="${p}">${p}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Category</label>
        <select name="CategorySelect" id="categorySelect">
          ${categoryOptions().map(c => `<option value="${c}">${c}</option>`).join("")}
          <option value="__other__">+ Add new category</option>
        </select>
      </div>
      <p class="field-hint" id="foodHint" style="display:none;margin:-6px 0 12px">Food is booked to ${CONFIG.KITCHEN_PROPERTY} and split with the other properties by headcount at month end. Pick who paid below.</p>
      <div class="field" id="categoryOtherField" style="display:none;">
        <label>New category name</label>
        <input name="CategoryOther" id="categoryOtherInput" placeholder="e.g. Pest control">
      </div>
      <div class="field"><label>Amount (₹)</label><input name="Amount" type="number" min="0" required></div>
      <div class="field"><label>Date</label><input name="Date" type="date" value="${todayISO()}" required></div>
      <div class="field"><label>Paid by</label>
        <select name="PaidBy">${Object.keys(getPeople(true)).map(p => `<option value="${p}">${p}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea name="Notes"></textarea></div>
      <p class="field-error" id="expenseErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Save expense</button>
      </div>
    </form>
  `);
  const catSelect = document.getElementById("categorySelect");
  const catOtherField = document.getElementById("categoryOtherField");
  const catOtherInput = document.getElementById("categoryOtherInput");
  catSelect.addEventListener("change", () => {
    const food = isFood(catSelect.value);
    document.getElementById("foodHint").style.display = food ? "block" : "none";
    if (food) document.getElementById("expProp").value = CONFIG.KITCHEN_PROPERTY;
    const isOther = catSelect.value === "__other__";
    catOtherField.style.display = isOther ? "block" : "none";
    catOtherInput.required = isOther;
  });
  document.getElementById("expenseForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.Category = (payload.CategorySelect === "__other__" ? payload.CategoryOther : payload.CategorySelect || "").trim();
    delete payload.CategorySelect;
    delete payload.CategoryOther;
    if (!payload.Category) {
      document.getElementById("expenseErr").textContent = "Please enter a category name.";
      document.getElementById("expenseErr").style.display = "block";
      return;
    }
    try {
      await apiPost("addExpense", payload);
      closeModal(); toast("Expense saved"); await loadData();
    } catch (err) {
      document.getElementById("expenseErr").textContent = err.message;
      document.getElementById("expenseErr").style.display = "block";
    }
  });
}

/* ============================================================ INIT */
function startApp() {
  render();
  loadData();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { renderPropertyFilter(); renderTabbar(); }, 120);
  });
}

function initLockScreen() {
  const screen = document.getElementById("lockScreen");
  const card = screen.querySelector(".lock-card");
  const input = document.getElementById("lockInput");
  screen.style.display = "flex";
  setTimeout(() => input.focus(), 150);
  document.getElementById("lockForm").addEventListener("submit", e => {
    e.preventDefault();
    if (input.value === CONFIG.APP_PIN) {
      try { sessionStorage.setItem("cozy_unlocked", "1"); } catch (err) {}
      screen.style.display = "none";
      startApp();
    } else {
      document.getElementById("lockErr").style.display = "block";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      input.value = "";
      input.focus();
    }
  });
}

let alreadyUnlocked = false;
try { alreadyUnlocked = sessionStorage.getItem("cozy_unlocked") === "1"; } catch (err) {}

if (CONFIG.APP_PIN && !alreadyUnlocked) {
  initLockScreen();
} else {
  startApp();
}
</script>
