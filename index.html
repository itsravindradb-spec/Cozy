/* ============================================================ DEPOSIT RETURN */
function openReturnDepositModal(t) {
  const openDues = tenantOpenDues(t.ID);
  const outstanding = openDues.reduce((s, d) => s + dueBalance(d), 0);
  const deposit = Number(t.Deposit || 0);
  openModal(`
    <p class="modal-title">Return deposit — ${t.Name}</p>
    <p class="modal-subtitle">Deposit on file: ${rupee(deposit)}${outstanding > 0 ? ` · ${rupee(outstanding)} rent still outstanding` : ""}</p>
    <form id="depositForm">
      <div class="field"><label>Adjust against outstanding/future rent (₹)</label><input name="adjustAmount" id="depAdjust" type="number" min="0" value="${Math.min(deposit, outstanding)}"></div>
      <p class="field-hint">This portion isn't paid out — it just settles rent dues directly, oldest first.</p>
      <div class="field"><label>Refund in cash (₹)</label><input name="cashAmount" id="depCash" type="number" min="0" value="${Math.max(0, deposit - Math.min(deposit, outstanding))}"></div>
      <div class="field"><label>Paid from (only needed if refunding cash)</label>
        <select name="paidBy">${Object.keys(CONFIG.PEOPLE).map(p => `<option value="${p}">${p}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div>
      <p class="field-hint" id="depTotal"></p>
      <p class="field-error" id="depositErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Return deposit</button>
      </div>
    </form>
  `);
  const updateTotal = () => {
    const adjust = Number(document.getElementById("depAdjust").value || 0);
    const cash = Number(document.getElementById("depCash").value || 0);
    const total = adjust + cash;
    const hint = document.getElementById("depTotal");
    hint.textContent = `Total: ${rupee(total)} of ${rupee(deposit)} deposit`;
    hint.style.color = total > deposit ? "var(--negative)" : "var(--ink-soft)";
  };
  ["depAdjust", "depCash"].forEach(id => document.getElementById(id).addEventListener("input", updateTotal));
  updateTotal();

  guardedSubmit(document.getElementById("depositForm"), async e => {
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.id = t.ID;
    const total = Number(payload.adjustAmount || 0) + Number(payload.cashAmount || 0);
    if (total > deposit) {
      document.getElementById("depositErr").textContent = "Adjustment + cash refund can't exceed the deposit amount.";
      document.getElementById("depositErr").style.display = "block";
      return;
    }
    try {
      await apiPost("returnDeposit", payload);
      closeModal(); toast("Deposit returned"); await loadData();
    } catch (err) {
      document.getElementById("depositErr").textContent = err.message;
      document.getElementById("depositErr").style.display = "block";
    }
  });
}

/* ============================================================ PAYMENTS */
function compressImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read the file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Couldn't decode the image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function deviceLabel() {
  const ua = navigator.userAgent || "";
  const androidMatch = ua.match(/Android[^;]*;\s*([^)]+)\)/);
  if (androidMatch) return androidMatch[1].split(";").pop().trim() + " (Android)";
  const iosMatch = ua.match(/(iPhone|iPad|iPod)/);
  if (iosMatch) return iosMatch[1] + " (iOS)";
  return (navigator.platform || "Unknown device");
}

function openRecordPaymentModal(tenantId) {
  const tenant = state.data.tenants.find(t => t.ID === tenantId);
  if (!tenant) return;
  const openDues = tenantOpenDues(tenantId);
  if (!openDues.length) { toast("No dues currently outstanding for this tenant."); return; }

  openModal(`
    <p class="modal-title">Record payment — ${tenant.Name}</p>
    <form id="paymentForm">
      <div class="field"><label>For period</label>
        <select name="dueId" id="dueSelect">
          ${openDues.map(d => `<option value="${d.ID}" data-balance="${dueBalance(d)}">${periodLabel(d.Period)} — ${rupee(dueBalance(d))} due</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Date</label><input name="date" type="date" value="${todayISO()}" required></div>
      <div class="field"><label>Amount received (₹)</label><input name="amount" id="amountInput" type="number" min="0" value="${dueBalance(openDues[0])}" required></div>
      <p class="field-hint">Paying more than what's due here automatically reduces the tenant's next month's rent.</p>
      <div class="field"><label>Payment mode</label>
        <select name="paymentMode" id="paymentModeSelect">
          ${Object.entries(CONFIG.PEOPLE).map(([person, cfg]) =>
            `<optgroup label="${person}">${cfg.modes.map(m => `<option value="${m}">${m}</option>`).join("")}</optgroup>`
          ).join("")}
        </select>
      </div>
      <div class="field" id="screenshotField" style="display:none;">
        <label>UPI payment screenshot</label>
        <input type="file" id="screenshotInput" accept="image/*" capture="environment">
        <p class="field-hint">Required for UPI — lets you verify any payment later. Not needed for cash.</p>
      </div>
      <div class="field"><label>Recorded by</label>
        <select name="recordedBy">${Object.keys(CONFIG.PEOPLE).map(p => `<option value="${p}">${p}</option>`).join("")}</select>
      </div>
      <input type="hidden" name="deviceInfo" id="deviceInfoInput" value="${deviceLabel()}">
      <div class="field"><label>Discount / write-off (₹, optional)</label><input name="discount" type="number" min="0" value="0"></div>
      <div class="field"><label>Notes (optional)</label><textarea name="notes"></textarea></div>
      <p class="field-error" id="paymentErr"></p>
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn submit">Save payment</button>
      </div>
    </form>
  `);
  document.getElementById("dueSelect").addEventListener("change", e => {
    const bal = e.target.selectedOptions[0].dataset.balance;
    document.getElementById("amountInput").value = bal;
  });

  const modeSelect = document.getElementById("paymentModeSelect");
  const screenshotField = document.getElementById("screenshotField");
  const screenshotInput = document.getElementById("screenshotInput");
  const toggleScreenshot = () => {
    const isCash = /cash/i.test(modeSelect.value);
    screenshotField.style.display = isCash ? "none" : "block";
    screenshotInput.required = !isCash;
    if (isCash) screenshotInput.value = "";
  };
  modeSelect.addEventListener("change", toggleScreenshot);
  toggleScreenshot();

  guardedSubmit(document.getElementById("paymentForm"), async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.tenantId = tenantId;
    const selectedDue = openDues.find(d => d.ID === payload.dueId) || openDues[0];
    const amount = Number(payload.amount || 0);
    const discount = Number(payload.discount || 0);
    const balance = Math.max(0, dueBalance(selectedDue) - amount - discount);

    const file = screenshotInput.files[0];
    if (screenshotInput.required && !file) {
      document.getElementById("paymentErr").textContent = "Please attach the UPI payment screenshot.";
      document.getElementById("paymentErr").style.display = "block";
      return;
    }
    if (file) {
      try {
        const compressed = await compressImageToBase64(file, 1280, 0.7);
        payload.screenshotData = compressed.base64;
        payload.screenshotType = compressed.mimeType;
        payload.screenshotName = (tenant.Name || "payment").replace(/[^a-z0-9]/gi, "_") + "-" + payload.date + ".jpg";
      } catch (err) {
        document.getElementById("paymentErr").textContent = "Couldn't process the screenshot — try a different photo.";
        document.getElementById("paymentErr").style.display = "block";
        return;
      }
    }

    try {
      await apiPost("recordPayment", payload);
      toast("Payment recorded");
      await loadData();
      openReceiptModal(tenant, {
        amount, discount, balance,
        mode: payload.paymentMode,
        date: payload.date,
        period: periodLabel(selectedDue.Period),
        person: personForMode(payload.paymentMode),
        dueAmount: Number(selectedDue.AmountDue || 0),
        rentAmount: Number(tenant.RentAmount || 0),
        roomNumber: tenant.RoomNumber
      });
    } catch (err) {
      document.getElementById("paymentErr").textContent = err.message;
      document.getElementById("paymentErr").style.display = "block";
    }
  });
}

/* ============================================================ LOCK SCREEN */
/* ★★★ EDIT #6 — LOGIN PIN. Change "289091" to any digits you like.
   The dots on the lock screen adjust automatically to the length. ★★★ */
const LOCK = { PIN: "289091", KEY: "cozyUnlocked" };

function startApp() {
  document.body.classList.remove("locked");
  const lock = document.getElementById("lockScreen");
  if (lock) lock.remove();
  document.removeEventListener("keydown", pinKeyHandler);
  render();
  loadData();
}

let pinEntry = "";

function drawPinDots() {
  const dots = document.getElementById("pinDots");
  if (!dots) return;
  dots.innerHTML = Array.from({ length: LOCK.PIN.length }, (_, i) =>
    `<span class="pin-dot${i < pinEntry.length ? " filled" : ""}"></span>`
  ).join("");
}

function pinFail() {
  const err = document.getElementById("pinErr");
  const dots = document.getElementById("pinDots");
  err.textContent = "Wrong PIN. Try again.";
  dots.classList.remove("shake");
  void dots.offsetWidth;
  dots.classList.add("shake");
  pinEntry = "";
  drawPinDots();
}

function pinPush(digit) {
  if (pinEntry.length >= LOCK.PIN.length) return;
  document.getElementById("pinErr").textContent = "";
  pinEntry += digit;
  drawPinDots();
  if (pinEntry.length === LOCK.PIN.length) {
    setTimeout(() => {
      if (pinEntry === LOCK.PIN) {
        try { sessionStorage.setItem(LOCK.KEY, "1"); } catch (e) {}
        startApp();
      } else {
        pinFail();
      }
    }, 140);
  }
}

function pinBack() {
  pinEntry = pinEntry.slice(0, -1);
  document.getElementById("pinErr").textContent = "";
  drawPinDots();
}

function pinKeyHandler(e) {
  if (/^[0-9]$/.test(e.key)) pinPush(e.key);
  else if (e.key === "Backspace") pinBack();
}

function initLock() {
  let unlocked = false;
  try { unlocked = sessionStorage.getItem(LOCK.KEY) === "1"; } catch (e) {}
  if (unlocked) { startApp(); return; }

  const keypad = document.getElementById("keypad");
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  keypad.innerHTML = keys.map(k => {
    if (k === "") return `<span></span>`;
    if (k === "del") return `<button class="key ghost" type="button" data-key="del">Delete</button>`;
    return `<button class="key" type="button" data-key="${k}">${k}</button>`;
  }).join("");
  keypad.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-key]");
    if (!btn) return;
    const k = btn.dataset.key;
    if (k === "del") pinBack(); else pinPush(k);
  });
  drawPinDots();
  document.addEventListener("keydown", pinKeyHandler);
}

/* ============================================================ INIT */
initLock();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderPropertyFilter(); renderTabbar(); }, 120);
});
